# Render Blueprint: one web service. FastAPI serves the API *and* the compiled frontend,
# so there is nothing else to host.
services:
  - type: web
    name: procurement-control-tower
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/categories
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7